<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Pneumonia Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-glass">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('home') }}">Pneumonia Detection</a>
        <div class="nav-buttons">
            <a href="{{ url_for('logout') }}" class="btn btn-gradient me-3">Logout</a>
            <a href="{{ url_for('home') }}" class="btn btn-gradient me-3">Home</a>
        </div>
    </div>
</nav>

<div class="hero-container">

    <div class="main-card mx-auto" style="max-width: 1200px; padding: 3rem;">
        <h2 class="mb-3">Admin Dashboard</h2>
        <p class="mb-4">Manage users of the system.</p>

        <div class="table-responsive">
            <table class="table table-dark table-hover text-center align-middle">
                <thead class="table-light text-dark">
                    <tr>
                        <th style="width:10%;">ID</th>
                        <th style="width:60%;">Username</th>
                        <th style="width:30%;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr>
                        <td>{{ user['id'] }}</td>
                        <td>{{ user['username'] }}</td>
                        <td>
                            <a href="{{ url_for('admin_delete_user', user_id=user['id']) }}" 
                               class="btn btn-gradient btn-sm"
                               onclick="return confirm('Are you sure you want to delete this user?');">
                               Delete
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</div>

<div class="background-blob blob1"></div>
<div class="background-blob blob2"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
