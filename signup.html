<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - Pneumonia Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>


<nav class="navbar navbar-glass">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('home') }}">Pneumonia Detection</a>
        <div class="nav-buttons">
            <a href="{{ url_for('login') }}" class="btn btn-gradient me-2">Login</a>
            <a href="{{ url_for('home') }}" class="btn btn-gradient me-2">Home</a>
        </div>
    </div>
</nav>


<div class="container mt-2">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
</div>


<div class="hero-container">
    <div class="main-card mx-auto">
        <h2>Sign Up</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" class="form-control mb-3" required>
            <input type="password" name="password" placeholder="Password" class="form-control mb-3" required>
            <button type="submit" class="btn-gradient w-100">Sign Up</button>
        </form>
        <p class="mt-3 text-center">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
</div>


<div class="background-blob blob1"></div>
<div class="background-blob blob2"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    
    window.addEventListener('DOMContentLoaded', (event) => {
        const alerts = document.querySelectorAll('.alert');
        alerts.forEach(alert => {
            setTimeout(() => {
                alert.style.transition = "opacity 0.5s";
                alert.style.opacity = '0';
                setTimeout(() => alert.remove(), 500);
            }, 2000);
        });
    });
</script>

</body>
</html>
